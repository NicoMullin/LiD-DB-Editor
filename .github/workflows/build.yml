name: Build Windows exe

# Runs on GitHub's own Windows machines, so nobody needs Python installed to
# get a working .exe - including you.
#
#   push to main / a pull request   -> run the tests, build, attach a zip you
#                                      can download from the run's Artifacts
#   Actions tab -> Run workflow,    -> all of the above, then tag the commit
#     with a version typed in          Release_Beta_V<version> and publish the
#                                      release "Beta V<version>" with the zip
#   push a tag Release_Beta_V0.11.0 -> the same release, from a tag you made
#     (or v0.11.0)
#
# A release is refused unless the version asked for is the one in
# lid_db_manager/__init__.py. The in-app updater reads the version out of the
# release's tag and the program reads its own from __init__.py; if the two
# disagreed, every copy would offer the same update forever.
on:
  push:
    branches: [main]
    tags: ["v*", "Release_Beta_V*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release for this version (e.g. 0.11.0). Leave empty to only build."
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest

    # Needed only by the release step; harmless otherwise.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # The interpreter the releases have been built with by hand.
          python-version: "3.13"
          cache: pip

      - name: Work out the version and whether to release
        id: label
        shell: pwsh
        run: |
          $inside = (Select-String -Path lid_db_manager/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          $asked = "${{ github.event.inputs.release_version }}".Trim()
          $release = "false"
          if ("${{ github.ref_type }}" -eq "tag") {
            # Release_Beta_V0.11.0 or v0.11.0 -> 0.11.0
            $asked = "${{ github.ref_name }}" -replace '^(Release_Beta_V|v)', ''
          }
          if ($asked) {
            if ($asked -ne $inside) {
              Write-Error "Asked to release $asked, but lid_db_manager/__init__.py says $inside. Change one of them so they match."
              exit 1
            }
            $release = "true"
            $version = $asked
          } else {
            $version = "$inside-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $safe = $version -replace '[^A-Za-z0-9._-]', '-'
          "version=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version $version, release: $release"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyInstaller with a bootloader compiled here
        # The bootloader in PyInstaller's wheel is identical in every PyInstaller
        # program, malware included, so some antivirus engines flag it on sight.
        # Compiling it from source (the runner has Visual Studio) gives it a hash
        # of its own. build.py prints which kind it found.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-cache-dir --no-binary pyinstaller pyinstaller

      - name: Run the tests
        # The GUI tests create real Qt widgets, so give Qt a headless platform.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t tests -v

      - name: Build the executable
        run: python build.py

      - name: Zip it up
        shell: pwsh
        run: |
          # build.py names the folder after the version: "LID DB Mod Manager 0.11.0".
          $folder = Get-ChildItem dist -Directory | Where-Object Name -like "LID DB Mod Manager*" | Select-Object -First 1
          if (-not $folder) { Write-Error "build.py left no program folder in dist"; exit 1 }
          $name = "LID-DB-Mod-Manager-${{ steps.label.outputs.version }}-win64.zip"
          Compress-Archive -Path $folder.FullName -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $name | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Hash the zip
        # Published with the release so anyone can check the file they got is
        # the one built here - a re-upload elsewhere, or a download that came
        # down damaged, will not match. It is also what a VirusTotal report is
        # keyed by, so the same string identifies the scan.
        id: hash
        shell: pwsh
        run: |
          $sha = (Get-FileHash $env:ZIP_NAME -Algorithm SHA256).Hash
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "SHA-256: $sha"
          # Also on the run's summary page, so builds that publish no release
          # (an ordinary push, or Run workflow) still show it.
          "### SHA-256`n`n``$($env:ZIP_NAME)``  `n``$sha``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Attach the zip to this run
        uses: actions/upload-artifact@v4
        with:
          name: LID-DB-Mod-Manager-${{ steps.label.outputs.version }}-win64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish a Release
        # Only when asked for, so ordinary pushes never create releases.
        if: steps.label.outputs.release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.label.outputs.version }}"
          # The tag the updater reads the version from, and the title players see.
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "Release_Beta_V$version" }
          $title = "Beta V$version"
          # The notes as written, plus the hash of the file actually published.
          # Built here rather than kept in the repo: every build has its own.
          $notes = "release-notes-published.md"
          Copy-Item ".github/release-notes.md" $notes
          $sha = "${{ steps.hash.outputs.sha256 }}"
          $lines = @(
            "",
            "---",
            "",
            "**Check your download.** In PowerShell, in the folder you saved it:",
            "",
            '```',
            "Get-FileHash .\$env:ZIP_NAME -Algorithm SHA256",
            '```',
            "",
            "It should print:",
            "",
            '```',
            $sha,
            '```',
            "",
            "VirusTotal report for this exact file (once it has been scanned):",
            "https://www.virustotal.com/gui/file/$sha",
            "",
            "_Some antivirus flags any newly built PyInstaller program. The launcher",
            "is compiled fresh here rather than taken from PyInstaller's wheel, which",
            "avoids the most common false positive._"
          )
          Add-Content -Path $notes -Value $lines -Encoding utf8
          # --target tags the commit this build came from when the tag is new.
          gh release create $tag "$env:ZIP_NAME" --title $title --notes-file $notes --target $env:GITHUB_SHA
