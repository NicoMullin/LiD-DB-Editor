name: Build Windows exe

# Runs on GitHub's own Windows machines, so nobody needs Python installed to
# get a working .exe - including you. A second job does the same on Linux
# (see "linux" below): the tests, and a -linux.tar.gz beside the zip.
#
#   push to main / a pull request   -> run the tests, build, attach a zip you
#                                      can download from the run's Artifacts
#   Actions tab -> Run workflow,    -> all of the above, then tag the commit
#     with a version typed in          Release_Beta_V<version> and publish the
#                                      release "Beta V<version>" with the zip
#   push a tag Release_Beta_V0.11.0 -> the same release, from a tag you made
#     (or v0.11.0)
#
# A release is refused unless the version asked for is the one in
# lid_db_manager/__init__.py. The in-app updater reads the version out of the
# release's tag and the program reads its own from __init__.py; if the two
# disagreed, every copy would offer the same update forever.
on:
  push:
    branches: [main]
    tags: ["v*", "Release_Beta_V*"]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_version:
        description: "Publish a release for this version: 0.11.0 or Beta V0.11.0. Leave empty to only build."
        required: false
        default: ""

jobs:
  build:
    runs-on: windows-latest

    # Needed only by the release step; harmless otherwise.
    permissions:
      contents: write

    # The release's tag, for the Linux job to add its file to.
    outputs:
      tag: ${{ steps.publish.outputs.tag }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          # The interpreter the releases have been built with by hand.
          python-version: "3.13"
          cache: pip

      - name: Work out the version and whether to release
        id: label
        shell: pwsh
        run: |
          $inside = (Select-String -Path lid_db_manager/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          $typed = "${{ github.event.inputs.release_version }}".Trim()
          if ("${{ github.ref_type }}" -eq "tag") { $typed = "${{ github.ref_name }}" }
          $release = "false"
          $asked = ""
          if ($typed) {
            # However it was written - 0.11.0, Beta V0.11.0, v0.11.0,
            # Release_Beta_V0.11.0 - the version is its numbers.
            $found = [regex]::Match($typed, '\d+(\.\d+)+')
            if (-not $found.Success) {
              Write-Error "No version number in '$typed'. Type it like 0.11.0 or Beta V0.11.0."
              exit 1
            }
            $asked = $found.Value
          }
          if ($asked) {
            if ($asked -ne $inside) {
              Write-Error "Asked to release $asked, but lid_db_manager/__init__.py says $inside. Change one of them so they match."
              exit 1
            }
            $release = "true"
            $version = $asked
          } else {
            $version = "$inside-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $safe = $version -replace '[^A-Za-z0-9._-]', '-'
          "version=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version $version, release: $release"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install PyInstaller with a bootloader compiled here
        # The bootloader in PyInstaller's wheel is identical in every PyInstaller
        # program, malware included, so some antivirus engines flag it on sight.
        # Compiling it from source (the runner has Visual Studio) gives it a hash
        # of its own. build.py prints which kind it found.
        env:
          PYINSTALLER_COMPILE_BOOTLOADER: "1"
        run: pip install --no-cache-dir --no-binary pyinstaller pyinstaller

      - name: Run the tests
        # The GUI tests create real Qt widgets, so give Qt a headless platform.
        # run_tests.py takes its exit code from the test result: the step here
        # sometimes ended with code 1 after every test passed. bash, not pwsh,
        # and the code Python really returned is printed if it is not 0.
        env:
          QT_QPA_PLATFORM: offscreen
        shell: bash
        run: |
          python tools/run_tests.py || { code=$?; echo "python tools/run_tests.py ended with exit code $code"; exit $code; }

      - name: Build the executable
        run: python build.py

      - name: Zip it up
        shell: pwsh
        run: |
          # build.py names the folder after the version: "LID DB Mod Manager 0.11.0".
          $folder = Get-ChildItem dist -Directory | Where-Object Name -like "LID DB Mod Manager*" | Select-Object -First 1
          if (-not $folder) { Write-Error "build.py left no program folder in dist"; exit 1 }
          $name = "LID-DB-Mod-Manager-${{ steps.label.outputs.version }}-win64.zip"
          Compress-Archive -Path $folder.FullName -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $name | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Hash the zip
        # Published with the release so anyone can check the file they got is
        # the one built here - a re-upload elsewhere, or a download that came
        # down damaged, will not match. It is also what a VirusTotal report is
        # keyed by, so the same string identifies the scan.
        id: hash
        shell: pwsh
        run: |
          $sha = (Get-FileHash $env:ZIP_NAME -Algorithm SHA256).Hash
          "sha256=$sha" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "SHA-256: $sha"
          # Also on the run's summary page, so builds that publish no release
          # (an ordinary push, or Run workflow) still show it.
          "### SHA-256`n`n``$($env:ZIP_NAME)``  `n``$sha``" |
            Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Send the zip to VirusTotal
        # Only for a release, and only when the repository has a VT_API_KEY
        # secret (Settings -> Secrets and variables -> Actions). The key is
        # never in the repository and never printed. If VirusTotal cannot be
        # reached the release still goes out; the notes then say so.
        # The zip is over the 32 MB simple-upload limit, so this asks for a
        # large-file upload address first, which free keys may use.
        if: steps.label.outputs.release == 'true'
        id: virustotal
        continue-on-error: true
        shell: pwsh
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          if (-not $env:VT_API_KEY) {
            Write-Host "No VT_API_KEY secret, so the zip was not sent to VirusTotal."
            "scan=skipped" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            exit 0
          }
          $headers = @{ "x-apikey" = $env:VT_API_KEY }
          $upload = (Invoke-RestMethod -Uri "https://www.virustotal.com/api/v3/files/upload_url" -Headers $headers).data
          $answer = curl.exe --silent --show-error --fail -X POST -H "x-apikey: $env:VT_API_KEY" -F "file=@$env:ZIP_NAME" $upload
          if ($LASTEXITCODE -ne 0) { throw "VirusTotal did not take the upload." }
          $analysis = ($answer | ConvertFrom-Json).data.id
          Write-Host "Sent to VirusTotal, analysis $analysis"
          "scan=started" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Attach the zip to this run
        uses: actions/upload-artifact@v6
        with:
          name: LID-DB-Mod-Manager-${{ steps.label.outputs.version }}-win64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish a Release
        # Only when asked for, so ordinary pushes never create releases.
        if: steps.label.outputs.release == 'true'
        id: publish
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = "${{ steps.label.outputs.version }}"
          # The tag the updater reads the version from, and the title players see.
          $tag = if ("${{ github.ref_type }}" -eq "tag") { "${{ github.ref_name }}" } else { "Release_Beta_V$version" }
          "tag=$tag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          $title = "Beta V$version"
          # The notes as written, plus the hash of the file actually published.
          # Built here rather than kept in the repo: every build has its own.
          $notes = "release-notes-published.md"
          Copy-Item ".github/release-notes.md" $notes
          $sha = "${{ steps.hash.outputs.sha256 }}"
          $lines = @(
            "",
            "---",
            "",
            "**Check your download.** In PowerShell, in the folder you saved it:",
            "",
            '```',
            "Get-FileHash .\$env:ZIP_NAME -Algorithm SHA256",
            '```',
            "",
            "It should print:",
            "",
            '```',
            $sha,
            '```',
            "",
            $(if ("${{ steps.virustotal.outputs.scan }}" -eq "started") {
              "VirusTotal report for this exact file - sent there by this build, results within a few minutes:"
            } else {
              "VirusTotal report for this exact file (once it has been scanned):"
            }),
            "https://www.virustotal.com/gui/file/$sha",
            "",
            "_Some antivirus flags any newly built PyInstaller program. The launcher",
            "is compiled fresh here rather than taken from PyInstaller's wheel, which",
            "avoids the most common false positive._"
          )
          Add-Content -Path $notes -Value $lines -Encoding utf8
          # --target tags the commit this build came from when the tag is new.
          gh release create $tag "$env:ZIP_NAME" --title $title --notes-file $notes --target $env:GITHUB_SHA

      - name: Check for the Nexus Mods settings
        # The same zip goes to the Nexus Mods page too, but only when the
        # repository has a NEXUS_API_KEY secret and a NEXUS_FILE_ID variable
        # (Settings -> Secrets and variables -> Actions). Without them this
        # is skipped and nothing else changes.
        if: steps.label.outputs.release == 'true'
        id: nexus
        shell: pwsh
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_FILE_ID: ${{ vars.NEXUS_FILE_ID }}
        run: |
          if ($env:NEXUS_API_KEY -and $env:NEXUS_FILE_ID) {
            "ready=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          } else {
            Write-Host "No NEXUS_API_KEY secret or NEXUS_FILE_ID variable, so nothing was sent to Nexus Mods."
          }

      - name: Upload to Nexus Mods
        # As a new version of the file already on the page; the one before is
        # moved to Old files. The GitHub release is out already, so a Nexus
        # problem only marks this step, never undoes the release.
        if: steps.nexus.outputs.ready == 'true'
        continue-on-error: true
        # Nexus Mods' own action, pinned to the commit of v1.0.0-beta.11
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ vars.NEXUS_FILE_ID }}
          filename: ${{ env.ZIP_NAME }}
          version: ${{ steps.label.outputs.version }}
          display_name: LID DB Mod Manager ${{ steps.label.outputs.version }}
          description: Beta V${{ steps.label.outputs.version }} - the same zip as the GitHub release, built by GitHub.
          archive_existing_version: 'true'
          update_mod_version: 'true'

      - name: Post the release to Discord
        # A card in the Discord server's #releases channel: the download, what's
        # new, how to update, the hash and the VirusTotal report. Only when the
        # repository has a DISCORD_RELEASES_WEBHOOK secret; the Nexus Mods link
        # is added once there is a NEXUS_PAGE_URL variable. The release is out
        # already, so a Discord problem only marks this step.
        if: steps.label.outputs.release == 'true'
        continue-on-error: true
        shell: pwsh
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASES_WEBHOOK }}
          NEXUS_PAGE_URL: ${{ vars.NEXUS_PAGE_URL }}
        run: |
          if (-not $env:DISCORD_WEBHOOK) {
            Write-Host "No DISCORD_RELEASES_WEBHOOK secret, so nothing was posted to Discord."
            exit 0
          }
          $version = "${{ steps.label.outputs.version }}"
          $tag = "${{ steps.publish.outputs.tag }}"
          $sha = "${{ steps.hash.outputs.sha256 }}"
          $repo = "${{ github.server_url }}/${{ github.repository }}"
          $page = "$repo/releases/tag/$tag"
          $zipUrl = "$repo/releases/download/$tag/$env:ZIP_NAME"
          $arrow = [char]0x2192

          # This version's "What's new" section of the notes. The notes are
          # wrapped at 78 columns and Discord keeps every line break, so each
          # paragraph is joined back into one line; list items stay one a line.
          $all = Get-Content ".github/release-notes.md" -Raw -Encoding utf8
          $pattern = "(?ms)^### What's new in Beta V$([regex]::Escape($version))[ \t]*\r?\n(.*?)(?=^### |\z)"
          $section = [regex]::Match($all, $pattern).Groups[1].Value
          $paragraphs = foreach ($block in ($section.Trim() -split '\r?\n\s*\r?\n')) {
            $lines = @()
            foreach ($line in ($block -split '\r?\n')) {
              $line = $line.Trim()
              if ($lines.Count -and $line -notmatch '^[-*] ') { $lines[-1] += " $line" } else { $lines += $line }
            }
            $lines -join "`n"
          }
          $news = ($paragraphs | Where-Object { $_ }) -join "`n`n"
          if (-not $news) { $news = "See the release notes." }
          # An embed field holds 1024 characters. Longer notes become one line
          # a paragraph - its bold lead-in and the first sentence after it, or
          # for a list the names of its items - and, if even that is too long,
          # are cut at a line break.
          $more = "`n`n[More in the release notes]($page)"
          if ($news.Length -gt 1024) {
            $out = [System.Collections.Generic.List[string]]::new()
            foreach ($p in ($paragraphs | Where-Object { $_ })) {
              $items = @($p -split "`n")
              if (@($items | Where-Object { $_ -notmatch '^[-*] ' }).Count -eq 0) {
                $names = foreach ($item in $items) {
                  $item = $item -replace '^[-*] ', ''
                  $b = [regex]::Match($item, '^\*\*(.+?)\*\*')
                  $name = if ($b.Success) { $b.Groups[1].Value } else { $item -replace '\*\*|`', '' }
                  $name = $name.TrimEnd('.', ':', ' ')
                  if ($name.Length -gt 40) { $name = $name.Substring(0, 40).TrimEnd() + [char]0x2026 }
                  $name
                }
                $list = $names -join ", "
                # After the line that introduces it ("Five new mods:"), if any.
                if ($out.Count -and $out[$out.Count - 1] -match ':(\*\*)?$') {
                  $out[$out.Count - 1] += " $list"
                } else {
                  $out.Add("$([char]0x2022) $list")
                }
                continue
              }
              $m = [regex]::Match($p, '^(\*\*.+?\*\*)\s*(.*)$', 'Singleline')
              $lead = if ($m.Success) { $m.Groups[1].Value } else { "" }
              $rest = if ($m.Success) { $m.Groups[2].Value } else { $p }
              $rest = ($rest -replace '\*\*|`', '') -replace '\s+', ' '
              # The first full stop that is not part of "..." ends the sentence.
              $first = [regex]::Match($rest, '^.*?(?<!\.)[.!?](?!\.)(?=\s|$)').Value
              if (-not $first) { $first = $rest }
              if ($first.Length -gt 180) {
                $at = $first.LastIndexOf(' ', 180)
                if ($at -lt 1) { $at = 180 }
                $first = $first.Substring(0, $at) + [char]0x2026
              }
              $line = if ($first -match '^[,.;:!?)]') { "$lead$first" } else { "$lead $first" }
              $out.Add(("$([char]0x2022) $line" -replace '\s+', ' ').TrimEnd())
            }
            $news = $out -join "`n"
            if ($news.Length + $more.Length -gt 1024) {
              $news = $news.Substring(0, 1024 - $more.Length)
              $end = $news.LastIndexOf("`n")
              if ($end -gt 0) { $news = $news.Substring(0, $end) }
            }
            $news = $news.TrimEnd() + $more
          }

          $nexus = if ($env:NEXUS_PAGE_URL) { "[Nexus Mods page]($env:NEXUS_PAGE_URL)" } else { "Coming soon." }
          $card = @{
            title = "LID DB Mod Manager - Beta V$version"
            url = $page
            color = 0x2ECC71
            description = "**[Download from GitHub]($zipUrl)** (``$env:ZIP_NAME``)`n`nUnzip it into a folder you can write to (**not** Program Files) and run ``LID DB Mod Manager.exe``. Nothing else to install. Windows may warn that the build isn't signed: **More info $arrow Run anyway**."
            fields = @(
              @{ name = "What's new"; value = $news },
              @{ name = "Updating"; value = "**From 0.11.0 or newer:** close the game, then **Help $arrow Check for updates $arrow Update now**.`n**From 0.10.1 or older:** unzip into a new folder, click **I'm updating** and pick your old folder.`nThen click **Save Mod List** once." },
              @{ name = "Nexus Mods"; value = $nexus },
              @{ name = "Check your download"; value = "SHA-256: ``$sha```n[VirusTotal report](https://www.virustotal.com/gui/file/$sha) - [Full release notes]($page)" }
            )
            footer = @{ text = "Released $(Get-Date -Format yyyy-MM-dd)" }
          }
          $body = @{ embeds = @($card); allowed_mentions = @{ parse = @() } } | ConvertTo-Json -Depth 6
          Invoke-RestMethod -Uri $env:DISCORD_WEBHOOK -Method Post -ContentType "application/json; charset=utf-8" -Body ([Text.Encoding]::UTF8.GetBytes($body))
          Write-Host "Posted Beta V$version to Discord."

  linux:
    # The same tests on Linux, and the Linux program: a tar.gz, because a zip
    # loses the mark that lets a file run. 22.04, the oldest Ubuntu GitHub
    # offers, so the program runs on older systems too (and the Steam Deck).
    # Its own job: a Linux problem never holds up the Windows release.
    runs-on: ubuntu-22.04

    outputs:
      release: ${{ steps.label.outputs.release }}
      version: ${{ steps.label.outputs.version }}
      tar: ${{ steps.pack.outputs.tar }}
      sha256: ${{ steps.pack.outputs.sha256 }}

    steps:
      - name: Check out the repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip

      - name: Work out the version and whether to release
        # The same as the Windows job's.
        id: label
        shell: pwsh
        run: |
          $inside = (Select-String -Path lid_db_manager/__init__.py -Pattern '^__version__ = "(.+)"').Matches[0].Groups[1].Value
          $typed = "${{ github.event.inputs.release_version }}".Trim()
          if ("${{ github.ref_type }}" -eq "tag") { $typed = "${{ github.ref_name }}" }
          $release = "false"
          $asked = ""
          if ($typed) {
            $found = [regex]::Match($typed, '\d+(\.\d+)+')
            if (-not $found.Success) {
              Write-Error "No version number in '$typed'. Type it like 0.11.0 or Beta V0.11.0."
              exit 1
            }
            $asked = $found.Value
          }
          if ($asked) {
            if ($asked -ne $inside) {
              Write-Error "Asked to release $asked, but lid_db_manager/__init__.py says $inside. Change one of them so they match."
              exit 1
            }
            $release = "true"
            $version = $asked
          } else {
            $version = "$inside-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $safe = $version -replace '[^A-Za-z0-9._-]', '-'
          "version=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "release=$release" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          Write-Host "Version $version, release: $release"

      - name: Install the libraries Qt needs
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libfontconfig1 libdbus-1-3 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Run the tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python tools/run_tests.py || { code=$?; echo "python tools/run_tests.py ended with exit code $code"; exit $code; }

      - name: Build the program
        run: python build.py

      - name: Pack it up
        id: pack
        run: |
          folder=$(find dist -maxdepth 1 -type d -name 'LID DB Mod Manager *' | head -n 1)
          if [ -z "$folder" ]; then echo "build.py left no program folder in dist"; exit 1; fi
          tar="LID-DB-Mod-Manager-${{ steps.label.outputs.version }}-linux.tar.gz"
          tar -C dist -czf "$tar" "$(basename "$folder")"
          sha=$(sha256sum "$tar" | cut -d' ' -f1)
          echo "tar=$tar" >> "$GITHUB_OUTPUT"
          echo "sha256=$sha" >> "$GITHUB_OUTPUT"
          ls -l "$tar"
          printf '### SHA-256\n\n`%s`  \n`%s`\n' "$tar" "$sha" >> "$GITHUB_STEP_SUMMARY"

      - name: Attach it to this run
        uses: actions/upload-artifact@v6
        with:
          name: LID-DB-Mod-Manager-${{ steps.label.outputs.version }}-linux
          path: ${{ steps.pack.outputs.tar }}
          if-no-files-found: error

  linux-release:
    # Once the Windows job has published the release, the Linux file goes on
    # it too, with its hash added to the notes.
    needs: [build, linux]
    if: needs.linux.outputs.release == 'true' && needs.build.outputs.tag != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Fetch the Linux program
        uses: actions/download-artifact@v6
        with:
          name: LID-DB-Mod-Manager-${{ needs.linux.outputs.version }}-linux

      - name: Add it to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          TAR: ${{ needs.linux.outputs.tar }}
          SHA: ${{ needs.linux.outputs.sha256 }}
        run: |
          gh release upload "$TAG" "$TAR" --repo "$GITHUB_REPOSITORY"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json body --jq .body > notes.md
          {
            echo ""
            echo "---"
            echo ""
            echo "**Linux:** \`$TAR\`. Unpack it somewhere you can write to and run"
            echo "\`LID DB Mod Manager\` in the folder. If it does not open, install"
            echo "\`libxcb-cursor0\`. Plugin mods need a Steam launch option - see"
            echo "\"Linux and the Steam Deck\" in the README. Check the download with"
            echo "\`sha256sum $TAR\`; it should print:"
            echo ""
            echo '```'
            echo "$SHA"
            echo '```'
          } >> notes.md
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --notes-file notes.md

      - name: Check for the Nexus Mods settings
        # A second file on the Nexus page, updated like the Windows one, once
        # the repository has a NEXUS_LINUX_FILE_ID variable.
        id: nexus
        env:
          NEXUS_API_KEY: ${{ secrets.NEXUS_API_KEY }}
          NEXUS_LINUX_FILE_ID: ${{ vars.NEXUS_LINUX_FILE_ID }}
        run: |
          if [ -n "$NEXUS_API_KEY" ] && [ -n "$NEXUS_LINUX_FILE_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "No NEXUS_API_KEY secret or NEXUS_LINUX_FILE_ID variable, so the Linux file was not sent to Nexus Mods."
          fi

      - name: Upload to Nexus Mods
        if: steps.nexus.outputs.ready == 'true'
        continue-on-error: true
        uses: Nexus-Mods/upload-action@98532f7670c27cbecc78fae03fa3e278147827e2
        with:
          api_key: ${{ secrets.NEXUS_API_KEY }}
          file_id: ${{ vars.NEXUS_LINUX_FILE_ID }}
          filename: ${{ needs.linux.outputs.tar }}
          version: ${{ needs.linux.outputs.version }}
          display_name: LID DB Mod Manager ${{ needs.linux.outputs.version }} (Linux)
          description: Beta V${{ needs.linux.outputs.version }} for Linux - the same tar.gz as the GitHub release, built by GitHub.
          archive_existing_version: 'true'
          update_mod_version: 'false'
