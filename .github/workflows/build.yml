name: Build Windows exe

# Runs on GitHub's own Windows machines, so nobody needs Python installed to
# get a working .exe - including you.
#
#   push to main / a pull request -> run the tests, build, attach a zip you can
#                                    download from the run's Artifacts section
#   push a tag like v0.1.0        -> all of the above, plus publish a Release
#                                    with the zip attached
#   Actions tab -> Run workflow   -> build on demand from any branch
on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    # Needed only by the release step; harmless otherwise.
    permissions:
      contents: write

    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          # PySide6 6.11 has no wheels for 3.14 yet; 3.12 is safely inside range.
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run the tests
        # The GUI tests create real Qt widgets, so give Qt a headless platform.
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m unittest discover -s tests -t tests -v

      - name: Build the executable
        run: python build.py

      - name: Work out the version label
        id: label
        shell: pwsh
        run: |
          $ref = "${{ github.ref_name }}"
          # A tag pushed as v0.1.0 becomes 0.1.0; anything else uses the commit.
          if ("${{ github.ref_type }}" -eq "tag") {
            $version = $ref -replace '^v', ''
          } else {
            $version = "$ref-$($env:GITHUB_SHA.Substring(0,7))"
          }
          $safe = $version -replace '[^A-Za-z0-9._-]', '-'
          "version=$safe" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Zip it up
        shell: pwsh
        run: |
          $name = "LID-DB-Mod-Manager-${{ steps.label.outputs.version }}-win64.zip"
          Compress-Archive -Path "dist/LID DB Mod Manager" -DestinationPath $name
          "ZIP_NAME=$name" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Get-Item $name | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Attach the zip to this run
        uses: actions/upload-artifact@v4
        with:
          name: LID-DB-Mod-Manager-${{ steps.label.outputs.version }}-win64
          path: ${{ env.ZIP_NAME }}
          if-no-files-found: error

      - name: Publish a Release
        # Only for tags, so ordinary pushes never create releases.
        if: github.ref_type == 'tag'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${{ github.ref_name }}" "$env:ZIP_NAME" --title "${{ github.ref_name }}" --notes-file ".github/release-notes.md"
